name: Update GitHub data

# Refreshes data/github.json (stars, forks, releases, READMEs). The commit
# triggers a Vercel deploy, which rebuilds the pages from it.
on:
  schedule:
    - cron: "17 */6 * * *" # every 6 hours (at :17)
  workflow_dispatch: {} # allow manual runs from the Actions tab

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Refresh GitHub data
        run: node scripts/fetch-github.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Check the site still builds
        run: node scripts/build.mjs

      - name: Commit if changed
        run: |
          if [[ -n "$(git status --porcelain data/github.json)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/github.json
            git commit -m "chore: refresh GitHub data"
            git push
          else
            echo "No changes."
          fi
